<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enlaces de invitación</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f1f1ee">
<meta name="color-scheme" content="only light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23b6a579' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preload" href="fuentes/eb-garamond-n400-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "EB Garamond"; font-style: normal; font-weight: 400 600; font-display: swap; src: url("fuentes/eb-garamond-n400-600-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root {
  --papel: #f1f1ee;
  --verde: #3f5032;
  --verde-suave: #5f6c55;
  --oro: #b6a579;
  --oro-titulo: #97824f;
  --oro-texto: #7a6636;
  --vino-boton: #7a1a24;
  --tarjeta: #ffffff;
  --borde-campo: #938a6f;
  --sombra: 40, 36, 22;
  --f-serif: "EB Garamond", Garamond, "Times New Roman", serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; padding: 2.5rem max(16px, env(safe-area-inset-right, 0px)) 3rem max(16px, env(safe-area-inset-left, 0px));
  background: var(--papel); color: var(--verde); font: 400 1.25rem/1.55 var(--f-serif);
}
main { max-width: 26rem; margin: 0 auto; }
h1 { margin: 0; text-align: center; font-weight: 500; font-size: clamp(2.2rem, 10vw, 2.8rem); line-height: 1.1; color: var(--oro-titulo); }
.intro { margin: .8rem 0 1.8rem; text-align: center; color: var(--verde-suave); text-wrap: balance; }
.tarjeta {
  display: grid; gap: 1.3rem; padding: clamp(1.3rem, 6vw, 1.8rem); background: var(--tarjeta);
  box-shadow: 0 18px 36px -24px rgba(var(--sombra), .5), 0 1px 3px rgba(var(--sombra), .12);
}
.campo { display: grid; gap: .45rem; }
label, .etq { font-weight: 600; font-size: .875rem; letter-spacing: .18em; text-transform: uppercase; color: var(--oro-texto); }
input {
  width: 100%; min-height: 52px; padding: .8rem 1rem; font: 400 1.1875rem/1.3 var(--f-serif); color: var(--verde);
  background: var(--papel); border: 1px solid var(--borde-campo); border-radius: 10px;
}
input:focus-visible { outline: none; border-color: var(--oro-texto); box-shadow: 0 0 0 3px rgba(151, 130, 79, .35); }
.ayuda { margin: 0; font-size: 1.0625rem; color: var(--verde-suave); }
.contador { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; gap: .6rem; align-items: center; }
.contador input { text-align: center; font-size: 1.375rem; font-variant-numeric: lining-nums tabular-nums; -moz-appearance: textfield; appearance: textfield; }
.contador input::-webkit-outer-spin-button, .contador input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.paso {
  display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; touch-action: manipulation;
  border: 1px solid var(--oro-titulo); background: var(--tarjeta); color: var(--oro-texto); font: 500 1.5rem/1 var(--f-serif);
}
.paso:disabled { opacity: .4; cursor: default; }
.resultado { display: grid; gap: .7rem; padding-top: 1.3rem; border-top: 1px solid rgba(182, 165, 121, .45); }
.enlace { font-size: 1rem; color: var(--verde-suave); background: #fbfaf7; }
.botones { display: grid; gap: .7rem; }
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: .55rem; min-height: 52px; padding: .8rem 1.4rem;
  font: 600 1.125rem/1 var(--f-serif); text-decoration: none; border-radius: 999px; cursor: pointer; touch-action: manipulation;
  border: 1px solid var(--oro-titulo); background: var(--tarjeta); color: var(--oro-texto);
}
.boton svg { width: 1.15em; height: 1.15em; flex: none; }
.boton-vino { background: var(--vino-boton); color: #e8cf96; border-color: #c9a968; }
.boton:active, .paso:not(:disabled):active { transform: scale(.97); }
.boton:focus-visible, .paso:focus-visible { outline: 2px solid var(--oro-texto); outline-offset: 3px; }
.listo { margin: 0; min-height: 1.5em; text-align: center; font-size: 1.0625rem; font-weight: 500; color: var(--oro-texto); }
</style>
</head>
<body>
<main>
  <h1>Enlaces de invitación</h1>
  <p class="intro">Escribe a quién va y para cuántas personas. Cada invitado recibe su propio enlace.</p>

  <form class="tarjeta" id="formulario" novalidate>
    <div class="campo">
      <label for="nombre">Nombre en la invitación</label>
      <input id="nombre" type="text" maxlength="60" placeholder="Ej.: Familia Pérez" autocapitalize="words" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-describedby="ayuda-nombre">
      <p class="ayuda" id="ayuda-nombre">Opcional. Se verá como «Para Familia Pérez».</p>
    </div>
    <div class="campo">
      <label for="personas">Personas</label>
      <div class="contador">
        <button type="button" class="paso" id="menos" aria-label="Una persona menos" aria-controls="personas">−</button>
        <input id="personas" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="10" value="2" enterkeyhint="done">
        <button type="button" class="paso" id="mas" aria-label="Una persona más" aria-controls="personas">+</button>
      </div>
    </div>

    <div class="resultado">
      <span class="etq" id="etq-enlace">Su enlace</span>
      <input class="enlace" id="enlace" type="text" readonly aria-labelledby="etq-enlace">
      <div class="botones">
        <a class="boton boton-vino" id="whatsapp" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2.2a9.7 9.7 0 0 0-8.4 14.6L2.3 21.7l5-1.3A9.7 9.7 0 1 0 12 2.2zm0 17.7a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 19.9zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8.9c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.8 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1z"/></svg>
          Enviar por WhatsApp
        </a>
        <button class="boton" id="copiar" type="button">Copiar enlace</button>
        <a class="boton" id="ver" href="./" target="_blank" rel="noopener">Ver cómo se ve</a>
      </div>
      <p class="listo" id="listo" role="status"></p>
    </div>
  </form>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const nombre = $("nombre"), personas = $("personas"), menos = $("menos"), mas = $("mas");
  const enlace = $("enlace"), whatsapp = $("whatsapp"), ver = $("ver"), listo = $("listo");
  const BASE = new URL("./", location.href).href;

  // Mismo formato que lee index.html: "personas|nombre" en base64url.
  const codificar = (n, quien) => {
    let bin = "";
    new TextEncoder().encode(n + "|" + quien).forEach((b) => { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  };
  const total = () => {
    const n = parseInt(personas.value, 10);
    return Number.isFinite(n) ? Math.min(10, Math.max(1, n)) : 1;
  };
  const actualizar = () => {
    const n = total();
    const quien = nombre.value.replace(/\s+/g, " ").trim();
    const url = BASE + "?i=" + codificar(n, quien);
    menos.disabled = n <= 1;
    mas.disabled = n >= 10;
    enlace.value = url;
    ver.href = url;
    const saludo = quien ? "¡Hola, " + quien + "!" : "¡Hola!";
    const texto = n === 1
      ? saludo + " Con mucho cariño queremos invitarte a nuestra boda. Tu invitación es para 1 persona. Ábrela aquí: " + url
      : saludo + " Con mucho cariño queremos invitarlos a nuestra boda. Su invitación es para " + n + " personas. Ábranla aquí: " + url;
    whatsapp.href = "https://wa.me/?text=" + encodeURIComponent(texto);
    listo.textContent = "";
  };

  menos.addEventListener("click", () => { personas.value = total() - 1; actualizar(); });
  mas.addEventListener("click", () => { personas.value = total() + 1; actualizar(); });
  personas.addEventListener("input", actualizar);
  personas.addEventListener("change", () => { personas.value = total(); actualizar(); });
  nombre.addEventListener("input", actualizar);
  $("formulario").addEventListener("submit", (e) => e.preventDefault());

  $("copiar").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(enlace.value); }
    catch (e) { enlace.select(); document.execCommand("copy"); }
    listo.textContent = "Enlace copiado.";
  });
  enlace.addEventListener("focus", () => enlace.select());

  actualizar();
})();
</script>
</body>
</html>
